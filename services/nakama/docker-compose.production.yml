services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  nakama:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >
        /nakama/nakama migrate up --database.address "nakama:$${POSTGRES_PASSWORD}@postgres:5432/nakama" &&
        exec /nakama/nakama --config /nakama/data/local.yml
        --database.address "nakama:$${POSTGRES_PASSWORD}@postgres:5432/nakama"
        --logger.level INFO
        --console.username "$${NAKAMA_CONSOLE_USERNAME}"
        --console.password "$${NAKAMA_CONSOLE_PASSWORD}"
        --console.signing_key "$${NAKAMA_CONSOLE_SIGNING_KEY}"
        --runtime.http_key "$${NAKAMA_RUNTIME_HTTP_KEY}"
        --session.encryption_key "$${NAKAMA_SESSION_ENCRYPTION_KEY}"
        --session.refresh_encryption_key "$${NAKAMA_REFRESH_ENCRYPTION_KEY}"
        --socket.server_key "$${NAKAMA_SERVER_KEY}"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      NAKAMA_CONSOLE_USERNAME: "${NAKAMA_CONSOLE_USERNAME:?NAKAMA_CONSOLE_USERNAME must be set}"
      NAKAMA_CONSOLE_PASSWORD: "${NAKAMA_CONSOLE_PASSWORD:?NAKAMA_CONSOLE_PASSWORD must be set}"
      NAKAMA_CONSOLE_SIGNING_KEY: "${NAKAMA_CONSOLE_SIGNING_KEY:?NAKAMA_CONSOLE_SIGNING_KEY must be set}"
      NAKAMA_RUNTIME_HTTP_KEY: "${NAKAMA_RUNTIME_HTTP_KEY:?NAKAMA_RUNTIME_HTTP_KEY must be set}"
      NAKAMA_SESSION_ENCRYPTION_KEY: "${NAKAMA_SESSION_ENCRYPTION_KEY:?NAKAMA_SESSION_ENCRYPTION_KEY must be set}"
      NAKAMA_REFRESH_ENCRYPTION_KEY: "${NAKAMA_REFRESH_ENCRYPTION_KEY:?NAKAMA_REFRESH_ENCRYPTION_KEY must be set}"
      NAKAMA_SERVER_KEY: "${NAKAMA_SERVER_KEY:?NAKAMA_SERVER_KEY must be set}"
      MATCH_PRICE_INGEST_SECRET: "${MATCH_PRICE_INGEST_SECRET:?MATCH_PRICE_INGEST_SECRET must be set}"
      MATCH_PRICE_ALLOW_BOOTSTRAP: "false"
      MATCH_PRICE_ALLOWED_SYMBOLS: "${MATCH_PRICE_ALLOWED_SYMBOLS:-BTC/USDT}"
      MATCH_PRICE_ALLOWED_SOURCE_PREFIXES: "${MATCH_PRICE_ALLOWED_SOURCE_PREFIXES:-binance:}"
      MATCH_PRICE_MAX_LATEST_AGE_SECONDS: "${MATCH_PRICE_MAX_LATEST_AGE_SECONDS:-300}"
      MATCH_PRICE_MAX_FUTURE_SKEW_SECONDS: "${MATCH_PRICE_MAX_FUTURE_SKEW_SECONDS:-120}"
      MATCH_PRICE_MAX_MOVE_BPS: "${MATCH_PRICE_MAX_MOVE_BPS:-2500}"
      MATCH_PRICE_REQUIRE_SIGNATURE: "true"
      MATCH_PRICE_SIGNATURE_MAX_SKEW_SECONDS: "${MATCH_PRICE_SIGNATURE_MAX_SKEW_SECONDS:-60}"
      FINANCE_METRICS_ADMIN_USER_IDS: "${FINANCE_METRICS_ADMIN_USER_IDS:-}"
      ALLOW_CLIENT_PORTFOLIO_SCORE_SUBMISSION: "false"
      ALLOW_DIRECT_FINANCE_MATCH_CREATION: "false"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:7350:7350"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  price-feed:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.price-feed
    depends_on:
      nakama:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_NAKAMA_HOST: nakama
      NEXT_PUBLIC_NAKAMA_PORT: "7350"
      NEXT_PUBLIC_NAKAMA_SERVER_KEY: "${NAKAMA_SERVER_KEY:?NAKAMA_SERVER_KEY must be set}"
      NEXT_PUBLIC_NAKAMA_USE_SSL: "false"
      NAKAMA_INGEST_MATCH_CANDLES_RPC_ID: ingest_match_candles
      MATCH_PRICE_INGEST_SECRET: "${MATCH_PRICE_INGEST_SECRET:?MATCH_PRICE_INGEST_SECRET must be set}"
      MATCH_PRICE_EXCHANGE: binance
      MATCH_PRICE_SYMBOL: BTC/USDT
      MATCH_PRICE_TIMEFRAME: 1m
      MATCH_PRICE_LIMIT: "120"
      MATCH_PRICE_POLL_INTERVAL_MS: "10000"
      MATCH_PRICE_MAX_BACKOFF_MS: "300000"
      MATCH_PRICE_ALERT_AFTER_FAILURES: "3"
      MATCH_PRICE_ALERT_WEBHOOK_URL: "${MATCH_PRICE_ALERT_WEBHOOK_URL:-}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_production_data:
